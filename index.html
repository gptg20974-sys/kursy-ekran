 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none" aria-hidden="true">'+shape+'</svg>';
}

Object.assign(conditions,{56:['','Ледяная морось'],57:['','Ледяная морось'],66:['','Ледяной дождь'],67:['','Ледяной дождь'],77:['','Снежные зёрна'],85:['','Снегопад'],86:['','Снегопад'],96:['','Гроза с градом'],99:['','Гроза с градом']});
const CACHE_KEY='market-screen-data-v2';
let loading=false,lastData=null,offline=false;
let manualNotice="",manualNoticeUntil=0;
if(new URLSearchParams(location.search).get('tv')==='1')document.documentElement.classList.add('tv');
function stamp(value){if(!value)return 'время неизвестно';const date=new Date(value);return Number.isFinite(date.getTime())?new Intl.DateTimeFormat('ru-RU',{...msk,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(date)+' МСК':'время неизвестно'}
function sourceNote(data,key){
 const source=data.sources?.[key],at=source?.updatedAt||data.fetchedAt;
 return source?.error||Date.now()-new Date(at).getTime()>1800000?' · сохранено '+stamp(at):'';
}
function status(){
 const el=document.querySelector('#status');
 if(manualNotice&&Date.now()<manualNoticeUntil){el.textContent=manualNotice;return}
 const delayed=lastData&&Date.now()-new Date(lastData.fetchedAt).getTime()>1800000;
 const partial=lastData&&Object.values(lastData.sources||{}).some(s=>s.error);
 el.parentElement.classList.toggle('warning',offline||delayed||partial);
 el.textContent=lastData?(offline?'Нет связи · данные от ':delayed?'Данные задерживаются · ':partial?'Часть источников недоступна · проверено ':'Проверено ')+stamp(lastData.fetchedAt):'Нет данных · повторим через 2 минуты';
}
function render(data,includeNews){
 for(const key of ['USD','JPY','EUR']){
  row(key,data.rates?.[key]);
  document.querySelector('[data-key="'+key+'"] .sub').textContent=({USD:'Доллар США',JPY:'Японская иена · за 1 ¥',EUR:'Евро'})[key]+' · ЦБ'+(data.rates?.date?' на '+data.rates.date:' · нет данных')+sourceNote(data,'rates');
 }
 row('BRENT',data.brent);
 const b=data.brent;
 document.querySelector('#brent-detail').textContent=(b?.contract?b.contract+' · $/барр. · '+(b.tradeDate?b.tradeDate.split('-').reverse().slice(0,2).join('.')+' ':'')+(b.tradeTime?b.tradeTime.slice(0,5)+' МСК · ':'')+'с задержкой':'Нет котировки · MOEX · $/баррель')+sourceNote(data,'brent');
 const w=data.weather;
 if(Number.isFinite(w?.temperature)){
  document.querySelector('#icon').innerHTML=weatherIcon(w.code);
  document.querySelector('#temp').textContent=Math.round(w.temperature)+'°';
  document.querySelector('#desc').textContent=(conditions[w.code]||['','Погода'])[1];
  document.querySelector('#weatherfoot').textContent='Ощущается '+Math.round(w.feels)+'° · ветер '+Math.round(w.wind)+' км/ч';
 }else{document.querySelector('#temp').textContent='—';document.querySelector('#desc').textContent='Погода недоступна';document.querySelector('#weatherfoot').textContent='';document.querySelector('#icon').textContent='—'}
 document.querySelector('#weather-state').textContent=sourceNote(data,'weather').replace(/^ · /,'');
 if(includeNews)showNews(data);
 status();
}
function showNews(data){headlines(data.news);const label=document.querySelector('.tickername');const stale=sourceNote(data,'news');label.textContent=stale?'РБК · АРХИВ':'РБК · НОВОСТИ';label.title=stale||'Новости РБК'}
function remember(data){try{localStorage.setItem(CACHE_KEY,JSON.stringify(data))}catch(e){/* Storage can be disabled or full. */}}
async function fetchData(){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);
 try{const response=await fetch('./data.json',{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error('HTTP');const data=await response.json();if(!data||!Number.isFinite(new Date(data.fetchedAt).getTime())||!(data.rates||data.brent||data.weather||data.news?.length))throw Error('Invalid data');return data}finally{clearTimeout(timeout)}
}
async function load(includeNews=false,manual=false){
 if(loading)return;
 loading=true;manualNotice="";manualNoticeUntil=0;
 const button=document.querySelector('#refresh');button.disabled=true;
 if(manual){button.textContent='Проверяю…';document.querySelector('#status').textContent='Проверяем данные…'}
 try{
  const previous=lastData?JSON.stringify([lastData.rates,lastData.brent,lastData.weather,lastData.news]):null;
  const data=await fetchData();lastData=data;offline=false;remember(data);render(data,includeNews);
  if(manual){
   const unchanged=previous===JSON.stringify([data.rates,data.brent,data.weather,data.news]);
   const partial=Object.values(data.sources||{}).some(source=>source.error);
   const delayed=Date.now()-new Date(data.fetchedAt).getTime()>1800000;
   manualNotice=delayed?'Проверено · свежие данные пока не опубликованы':partial?'Данные получены · часть источников недоступна':unchanged?'Проверено · новых данных нет':'Данные обновлены';
   manualNoticeUntil=Date.now()+7000;status();setTimeout(status,7100);
  }
 }catch(e){
  offline=true;status();if(!lastData&&includeNews)headlines([]);
  if(manual){manualNotice=lastData?'Нет связи · сохранённые данные на экране':'Нет связи · повторим через 2 минуты';manualNoticeUntil=Date.now()+7000;status();setTimeout(status,7100)}
 }finally{loading=false;button.disabled=false;button.textContent='Обновить ↻'}
}

async function refreshNews(){try{const data=await fetchData();showNews(data)}catch(e){/* Retain the last successful headlines. */}}
try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY));if(cached&&Number.isFinite(new Date(cached.fetchedAt).getTime())){lastData=cached;offline=true;render(cached,true)}}catch(e){/* Ignore invalid or unavailable storage. */}
document.querySelector('#refresh').addEventListener('click',()=>load(true,true));
window.addEventListener('online',()=>load(true));
load(true);setInterval(()=>load(false),120000);setInterval(refreshNews,300000);setInterval(status,60000);
</script></body></html>
